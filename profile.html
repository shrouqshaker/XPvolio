<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile & Dashboard | XPvolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Geist:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/profile.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-3 sticky-top">
    <div class="container-xl">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-primary fs-4" href="index.html">
        <i class="fa-solid fa-file-signature"></i> XPvolio
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-menu navbar-nav ms-auto align-items-center gap-3">
          <li class="nav-item"><a class="nav-link fw-medium text-dark" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link fw-medium text-dark" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link fw-medium text-dark" href="contact.html">Contact Us</a></li>
          
          <li class="nav-item dropdown">
            <button class="btn btn-primary-custom dropdown-toggle px-3 py-2 rounded-3 shadow-sm d-flex align-items-center gap-2" data-bs-toggle="dropdown">
              <i class="fa-solid fa-plus"></i> Create New
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow border-0 rounded-3">
              <li><button class="dropdown-item py-2 d-flex align-items-center gap-2" onclick="promptCreateDoc('CV')"><i class="fa-solid fa-id-card text-primary"></i> Create Resume (CV)</button></li>
              <li><button class="dropdown-item py-2 d-flex align-items-center gap-2" onclick="promptCreateDoc('Portfolio')"><i class="fa-solid fa-globe text-success"></i> Create Web Portfolio</button></li>
            </ul>
          </li>

          <li class="nav-item">
            <button onclick="window.Auth.logout()" class="btn btn-outline-danger px-3 py-2 rounded-3 d-flex align-items-center gap-2">
              <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="flex-grow-1 py-5">
    <div class="container-xl">
      <div id="profileAlert" class="alert alert-success d-none py-2 px-3 small rounded-3 mb-4" role="alert"></div>

      <div class="row g-4">
        <aside class="col-12 col-lg-4">
          <div class="dashboard-card p-4 text-center mb-4">
            <div class="d-flex justify-content-center mb-3">
              <div class="avatar-circle" id="userAvatar">U</div>
            </div>
            <h2 class="h5 fw-bold text-dark mb-1" id="profileName">User Name</h2>
            <p class="text-secondary small mb-3" id="profileEmail">user@example.com</p>

            <div class="d-flex justify-content-center gap-2 mb-4">
              <span class="badge bg-primary bg-opacity-10 text-primary border border-primary border-opacity-25 rounded-pill px-3 py-1 fw-semibold">
                <i class="fa-solid fa-crown me-1 text-warning"></i> Pro Plan
              </span>
            </div>

            <hr class="my-3 text-muted">

            <div class="row text-center py-2">
              <div class="col-4 border-end">
                <p class="h5 fw-bold text-primary mb-0" id="totalCvsCount">0</p>
                <small class="text-secondary">Resumes</small>
              </div>
              <div class="col-4 border-end">
                <p class="h5 fw-bold text-success mb-0" id="totalPortfoliosCount">0</p>
                <small class="text-secondary">Portfolios</small>
              </div>
              <div class="col-4">
                <p class="h5 fw-bold text-warning mb-0" id="avgAtsScore">--</p>
                <small class="text-secondary">Avg ATS</small>
              </div>
            </div>

            <div class="mt-4 d-grid gap-2">
              <button class="btn btn-outline-primary rounded-3 btn-sm py-2 fw-medium" data-bs-toggle="modal" data-bs-target="#editProfileModal">
                <i class="fa-solid fa-user-pen me-2"></i> Edit Account Info
              </button>
            </div>
          </div>
        </aside>

        <section class="col-12 col-lg-8">
          <div class="dashboard-card p-4 h-100">
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
              <div>
                <h1 class="h4 fw-bold text-dark mb-1">My Projects &amp; Resumes</h1>
                <p class="text-secondary small mb-0">Manage all your tailored CVs and live portfolios.</p>
              </div>

              <div class="btn-group bg-light p-1 rounded-pill border" role="group">
                <button type="button" class="btn btn-sm rounded-pill px-3 filter-btn active" onclick="filterDocs('ALL', this)">All</button>
                <button type="button" class="btn btn-sm rounded-pill px-3 filter-btn" onclick="filterDocs('CV', this)">Resumes (CVs)</button>
                <button type="button" class="btn btn-sm rounded-pill px-3 filter-btn" onclick="filterDocs('Portfolio', this)">Portfolios</button>
              </div>
            </div>

            <div class="row g-3" id="documentsListContainer"></div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <div class="modal fade" id="editProfileModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow rounded-4">
        <div class="modal-header border-bottom">
          <h5 class="modal-title fw-bold">Edit Account Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form onsubmit="handleUpdateProfile(event)">
          <div class="modal-body p-4">
            <div class="mb-3">
              <label class="form-label small fw-semibold text-secondary">Full Name</label>
              <input type="text" id="editNameInput" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold text-secondary">New Password (optional)</label>
              <input type="password" id="editPasswordInput" class="form-control" placeholder="••••••••">
            </div>
          </div>
          <div class="modal-footer border-top">
            <button type="button" class="btn btn-light rounded-3" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary-custom px-4 rounded-3">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
